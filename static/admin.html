<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考試後台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<nav class="navbar">
  <span class="navbar-brand">考試後台</span>
  <div class="tabs hidden" id="tabs">
    <button data-tab="exams" class="active">考試</button>
    <button data-tab="questions">題庫</button>
    <button data-tab="students">名單</button>
  </div>
  <span class="spacer"></span>
  <button class="btn ghost sm hidden" id="logout">登出</button>
</nav>

<section id="view-login" class="container hidden">
  <div class="card center">
    <h1>老師登入</h1>
    <form id="login-form">
      <input type="password" id="pw" placeholder="後台密碼" autofocus>
      <div style="margin-top:1rem"><button class="btn" type="submit">登入</button></div>
    </form>
    <div class="msg ng" id="login-msg"></div>
  </div>
</section>

<!-- 考試 -->
<section id="view-exams" class="container wide hidden">
  <div class="row"><h1 style="margin:0">考試</h1><button class="btn sm" id="new-exam">新增考試</button></div>
  <div id="exam-form" class="card hidden" style="margin-top:1rem">
    <h2 id="exam-form-title" style="margin-top:0">新增考試</h2>
    <div class="grid2">
      <div><label>考試名稱</label><input type="text" id="e-title"></div>
      <div><label>限時（分鐘）</label><input type="number" id="e-duration" min="1" value="50"></div>
      <div><label>開放時間（空白 = 隨時）</label><input type="datetime-local" id="e-start"></div>
      <div><label>結束時間（空白 = 不限）</label><input type="datetime-local" id="e-end"></div>
      <div><label>適用班級（逗號分隔，空白 = 全部）</label><input type="text" id="e-classes" placeholder="701,702"></div>
      <div><label>交卷後學生看到</label>
        <select id="e-show">
          <option value="score">只有總分</option>
          <option value="answers">總分 + 對錯與正解</option>
          <option value="explain">總分 + 對錯 + 解析</option>
        </select></div>
    </div>
    <div style="margin-top:.75rem">
      <label class="check"><input type="checkbox" id="e-shuffle-q" checked> 題目順序亂數</label>
      <label class="check"><input type="checkbox" id="e-shuffle-opt" checked> 選項順序亂數</label>
      <label class="check"><input type="checkbox" id="e-published"> 開放給學生看到</label>
    </div>
    <label>允許進場的 IP（一行一個，可寫 CIDR；空白 = 不限）</label>
    <textarea id="e-ips" class="mono" placeholder="203.0.113.10"></textarea>
    <button class="btn ghost sm" id="add-my-ip" style="margin-top:.4rem">加入我現在的 IP</button>
    <span class="muted" id="my-ip"></span>
    <label>題目（勾選要考的題目，依勾選順序出題）</label>
    <input type="text" id="e-filter" placeholder="依題幹或標籤篩選">
    <div class="qpick" id="e-questions" style="margin-top:.4rem"></div>
    <p class="muted" id="e-picked"></p>
    <div class="row" style="margin-top:1rem">
      <button class="btn" id="save-exam">儲存</button>
      <button class="btn ghost" id="cancel-exam">取消</button>
    </div>
    <div class="msg" id="exam-msg"></div>
  </div>
  <div class="table-wrap" style="margin-top:1rem"><table id="exam-table"></table></div>
</section>

<!-- 考場監控 -->
<section id="view-monitor" class="container wide hidden">
  <div class="row">
    <button class="btn ghost sm" data-back>← 回考試列表</button>
    <h1 style="margin:0" id="mon-title"></h1>
    <span class="muted">每 5 秒自動更新</span>
    <span class="spacer" style="flex:1"></span>
    <a class="btn ghost sm" id="mon-csv">匯出成績 CSV</a>
    <button class="btn ghost sm" id="mon-stats">各題分析</button>
  </div>
  <div class="summary" id="mon-summary"></div>
  <div class="table-wrap"><table id="mon-table"></table></div>
</section>

<!-- 各題分析 -->
<section id="view-stats" class="container wide hidden">
  <div class="row">
    <button class="btn ghost sm" id="stats-back">← 回考場監控</button>
    <h1 style="margin:0" id="stats-title"></h1>
  </div>
  <p class="muted">填充題列出每一格所有不同答法；漏掉的正確寫法按「算對」，會加入答案並重新計算所有人分數。</p>
  <div id="stats-body"></div>
</section>

<!-- 題庫 -->
<section id="view-questions" class="container wide hidden">
  <div class="row">
    <h1 style="margin:0">題庫</h1>
    <button class="btn sm" id="new-q">新增題目</button>
    <label class="btn ghost sm" style="margin:0;color:var(--text)">匯入 CSV<input type="file" id="q-file" accept=".csv" hidden></label>
    <a class="muted" href="/samples/questions.csv" download>下載範例 CSV</a>
  </div>
  <div class="msg" id="q-msg"></div>
  <div id="q-form" class="card hidden">
    <h2 id="q-form-title" style="margin-top:0">新增題目</h2>
    <div class="grid2">
      <div><label>題型</label>
        <select id="q-type"><option value="single">單選</option><option value="multi">多選</option><option value="fill">填充</option></select></div>
      <div><label>分數</label><input type="number" id="q-points" value="1" step="0.5" min="0"></div>
      <div id="q-multi-wrap"><label>多選計分</label>
        <select id="q-multi"><option value="all">全對才給分</option><option value="partial">學測式部分給分</option></select></div>
      <div><label>標籤</label><input type="text" id="q-tags" placeholder="第一章,迴圈"></div>
    </div>
    <label>題幹（填充題用 ___ 標出空格位置）</label><textarea id="q-stem"></textarea>
    <label>程式碼（可空白）</label><textarea id="q-code" class="mono"></textarea>
    <div id="q-opt-wrap"><label>選項（一行一個，依序為 A、B、C…，最多 6 個）</label><textarea id="q-options"></textarea></div>
    <label id="q-answer-label">正確答案</label><input type="text" id="q-answer">
    <label>解析</label><textarea id="q-explain"></textarea>
    <div class="row" style="margin-top:1rem">
      <button class="btn" id="save-q">儲存</button>
      <button class="btn ghost" id="cancel-q">取消</button>
    </div>
    <div class="msg" id="q-form-msg"></div>
  </div>
  <input type="text" id="q-filter" placeholder="依題幹或標籤篩選" style="margin-top:1rem">
  <div class="table-wrap" style="margin-top:.5rem"><table id="q-table"></table></div>
</section>

<!-- 名單 -->
<section id="view-students" class="container wide hidden">
  <div class="row">
    <h1 style="margin:0">學生名單</h1>
    <label class="btn ghost sm" style="margin:0;color:var(--text)">匯入 CSV<input type="file" id="s-file" accept=".csv" hidden></label>
    <label class="check"><input type="checkbox" id="s-replace"> 匯入時清除舊名單（有作答紀錄的保留）</label>
    <a class="muted" href="/samples/students.csv" download>下載範例 CSV</a>
  </div>
  <div class="card row" style="margin-top:1rem">
    <input type="text" id="s-id" placeholder="學號" style="max-width:160px">
    <input type="text" id="s-name" placeholder="姓名" style="max-width:160px">
    <input type="text" id="s-class" placeholder="班級" style="max-width:160px">
    <button class="btn sm" id="add-s">新增／更新</button>
  </div>
  <div class="msg" id="s-msg"></div>
  <div class="table-wrap"><table id="s-table"></table></div>
</section>

<script src="/common.js"></script>
<script src="/admin.js"></script>
</body>
</html>
