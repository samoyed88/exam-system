# 預設只啟動 app（http://localhost:8000）。
# 對外公開二選一：
#   docker compose --profile tunnel up -d   # Cloudflare Tunnel（Mac mini 放家裡適用，IP_HEADER=cf）
#   docker compose --profile caddy up -d    # Caddy 自動 HTTPS（VPS 適用，IP_HEADER=xff）
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8000:8000"

  cloudflared:
    image: cloudflare/cloudflared:2024.10.0
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
      # 用 CLI 建的 tunnel（沒有在 Dashboard 設 Public Hostname）時，直接把流量送到 app
      - TUNNEL_URL=http://app:8000
    depends_on:
      - app

  caddy:
    image: caddy:2.8
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  caddy_data:
